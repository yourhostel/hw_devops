apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-site
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: static-site
  template:
    metadata:
      labels:
        app: static-site
    spec:
      containers:
      - name: nginx
        image: nginx:{{ .Values.nginx.tag }}
        ports:
        - containerPort: 80
        volumeMounts:
        - name: custom-html
          mountPath: /etc/nginx/custom-html
          readOnly: true
        args:
        - /bin/sh
        - -c
        - |
          cat <<EOF > /etc/nginx/conf.d/default.conf
          server {
              listen 80;
              server_name localhost;

              location / {
                  root /etc/nginx/custom-html;
                  index index.html;
              }
          }
          EOF
          nginx -g 'daemon off;'
      volumes:
      - name: custom-html
        configMap:
          name: nginx-html
          items:
          - key: index.html
            path: index.html
